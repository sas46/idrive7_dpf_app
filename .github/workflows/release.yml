name: SDK-free release package
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("apps/idrive7_dpf_app/app.json"))["version"])')
          test "$TAG" = "v$VERSION"
          test ! -e oap-sdk
          node tests/readonly-diag.test.js
          python kit/tools/build.py --no-sdk idrive7_dpf_app
          python tests/check_release.py "dist/idrive7_dpf_app@$VERSION.tgz"
          mkdir -p /tmp/dpf-release-test
          tar -xzf "dist/idrive7_dpf_app@$VERSION.tgz" -C /tmp/dpf-release-test
          node tests/cluster.test.js /tmp/dpf-release-test/package/javascript
          node tests/cluster-socket.test.js /tmp/dpf-release-test/package/javascript
      - name: Attach verified TGZ
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tgz
